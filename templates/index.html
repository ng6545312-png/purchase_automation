<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Receipt Scanner</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">Bill / Receipt Upload</h3>
                        <form action="/" method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label font-weight-bold">Select Invoice Images (Multiple allowed):</label>
                                <input type="file" name="file" class="form-control" accept="image/*" multiple required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Upload & Process</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="/invoices" class="text-decoration-none">View All Saved Invoices →</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
